name: Release

# One-button release: Actions -> Release -> "Run workflow".
# Computes the version from Conventional Commits, updates CHANGELOG.md, commits,
# tags and creates the GitHub release. Packagist picks up the tag.
#
# Pushing a v*.*.* tag by hand still works and only runs checks + creates the release.

on:
  workflow_dispatch:
    inputs:
      bump:
        description: 'Version bump (auto = derived from commits) or an explicit version like 1.0.0'
        required: true
        default: auto
        type: choice
        options: [auto, patch, minor, major]
      version:
        description: 'Explicit version X.Y.Z (overrides "bump" when set)'
        required: false
        type: string
      dry_run:
        description: 'Only show the new version and changelog; do not commit, tag or release'
        required: true
        default: false
        type: boolean
  push:
    tags: ['v*.*.*']

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    steps:
      - name: Refuse to release from a branch other than main
        if: github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/main'
        run: |
          echo "::error::Run this workflow on main (selected: ${GITHUB_REF})."
          exit 1

      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer:v2

      - run: composer update --no-interaction --no-progress

      - name: Full check before releasing
        run: |
          composer validate --strict
          vendor/bin/php-cs-fixer fix --dry-run --diff
          vendor/bin/phpstan analyse --memory-limit=512M --no-progress
          vendor/bin/phpunit
          composer audit

      # ---- one-button path -------------------------------------------------
      - name: Prepare version and changelog
        id: prepare
        if: github.event_name == 'workflow_dispatch'
        env:
          NOTES_FILE: ${{ runner.temp }}/release-notes.md
          BUMP: ${{ inputs.version != '' && inputs.version || inputs.bump }}
        run: |
          version="$(bash .github/scripts/prepare-release.sh "${BUMP}" | tail -n 1)"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          {
            echo "## Release v${version}"
            echo
            cat "${NOTES_FILE}"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Commit, tag and push
        if: github.event_name == 'workflow_dispatch' && !inputs.dry_run
        env:
          VERSION: ${{ steps.prepare.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md
          git commit -m "chore(release): v${VERSION}"
          git tag -a "v${VERSION}" -m "v${VERSION}"
          git push --atomic origin "HEAD:${GITHUB_REF_NAME}" "v${VERSION}"

      - name: Create GitHub release
        if: github.event_name == 'workflow_dispatch' && !inputs.dry_run
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.prepare.outputs.version }}
          NOTES_FILE: ${{ runner.temp }}/release-notes.md
        run: gh release create "v${VERSION}" --title "v${VERSION}" --notes-file "${NOTES_FILE}" --verify-tag

      # ---- manual tag path -------------------------------------------------
      - name: Create GitHub release for a manually pushed tag
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" --title "${GITHUB_REF_NAME}" --generate-notes
