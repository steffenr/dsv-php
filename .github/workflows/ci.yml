name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: PHP ${{ matrix.php }} (${{ matrix.deps }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.4', '8.5']
        deps: [highest, lowest]
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: pcov
          tools: composer:v2
      - name: Install dependencies
        run: |
          if [ "${{ matrix.deps }}" = "lowest" ]; then
            composer update --prefer-lowest --prefer-stable --no-interaction --no-progress
          else
            composer update --no-interaction --no-progress
          fi
      - name: Validate composer.json
        run: composer validate --strict
      - name: Tests
        run: vendor/bin/phpunit --coverage-text --coverage-clover=build/clover.xml

  quality:
    name: Static analysis & style
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer:v2
      - run: composer update --no-interaction --no-progress
      - name: Code style
        run: vendor/bin/php-cs-fixer fix --dry-run --diff
      - name: PHPStan (level max)
        run: vendor/bin/phpstan analyse --memory-limit=512M --no-progress
      - name: Security advisories
        run: composer audit
